name: tests

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: agentflow-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: AgentFlow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q
